function validateForm(){const name=nameInput.value.trim(),phone=phoneInput.value.trim(),date=dateInput.value,time=timeInput.value,count=+countInput.value;if(!selectedTable)throw Error("Odaberite stol.");if(!name||!phone||!date)throw Error("Popunite sva obavezna polja.");if(!/^[0-9+\s()-]{8,20}$/.test(phone))throw Error("Unesite ispravan broj mobitela.");if(date<LOCAL_DATE(new Date()))throw Error("Datum ne može biti u prošlosti.");if(!allowed(parseDate(date)))throw Error("Rezervacije su moguće samo srijedom, petkom i subotom.");if(!adultInput.checked)throw Error("Za rezervaciju morate potvrditi da imate najmanje 18 godina.");if(!Number.isInteger(count)||count<1||count>6)throw Error("Broj osoba mora biti između 1 i 6.");return{name,phone,date,time,count}}
function whatsAppMessage(table,r){return `NOVA REZERVACIJA - LEVEL Caffe & Night Bar\n\nStol: #${table}\nZona: ${zones[table]||"LEVEL"}\nDatum: ${formatDate(r.date)}\nVrijeme: ${r.time}\nBroj osoba: ${r.count}\n\nIme i prezime: ${r.name}\nMobitel: ${r.phone}\nDobna potvrda: 18+ potvrđeno`}
async function saveReservation(){if(isSaving)return;let popup=null;try{const r=validateForm();popup=window.open("about:blank","_blank");isSaving=true;saveButton.disabled=true;saveButton.textContent="Spremanje...";const{data:existing,error:checkError}=await supabaseClient.from("reservations").select("id").eq("table_id",selectedTable).eq("reservation_date",r.date).limit(1);if(checkError)throw Error("Nije moguće provjeriti raspoloživost stola.");if(existing?.length){await loadReservations(r.date);throw Error("Stol je u međuvremenu rezerviran. Odaberite drugi stol.")}const tableId=selectedTable;const{error}=await supabaseClient.from("reservations").insert([{table_id:tableId,reservation_date:r.date,reservation_time:r.time,guest_count:r.count,name:r.name,phone:r.phone}]);if(error){if(error.code==="23505"){await loadReservations(r.date);throw Error("Stol je u međuvremenu rezerviran. Odaberite drugi stol.")}throw Error("Greška kod spremanja rezervacije.")}const url=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(whatsAppMessage(tableId,r))}`;if(popup)popup.location.href=url;else window.location.href=url;reservedTables.add(tableId);resetForm();closeModal();await loadReservations(r.date)}catch(e){if(popup&&!popup.closed)popup.close();console.error(e);alert(e.message||"Došlo je do neočekivane greške.")}finally{isSaving=false;saveButton.disabled=false;saveButton.textContent="Potvrdi i otvori WhatsApp"}}
async function loadReservations(date=dateInput.value){if(!date)return;const{data,error}=await supabaseClient.from("reservations").select("table_id").eq("reservation_date",date);if(error){console.error(error);alert("Nije moguće učitati rezervacije.");return renderTables()}reservedTables=new Set((data||[]).map(r=>+r.table_id));if(selectedTable!==null&&reservedTables.has(selectedTable))closeModal();else renderTables()}
function subscribe(){supabaseClient.channel("reservations-live").on("postgres_changes",{event:"*",schema:"public",table:"reservations"},()=>loadReservations()).subscribe()}
dateTrigger.onclick=()=>{calendar.classList.toggle("is-open");dateTrigger.setAttribute("aria-expanded",calendar.classList.contains("is-open"))};$("calendarPrev").onclick=()=>{calendarView.setMonth(calendarView.getMonth()-1);renderCalendar()};$("calendarNext").onclick=()=>{calendarView.setMonth(calendarView.getMonth()+1);renderCalendar()};$("previousEventDate").onclick=()=>moveEventDate(-1);$("nextEventDate").onclick=()=>moveEventDate(1);saveButton.onclick=saveReservation;cancelButton.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.onkeydown=e=>{if(e.key==="Escape"&&modal.classList.contains("is-open"))closeModal()};
document.addEventListener("DOMContentLoaded",async()=>{setDate(LOCAL_DATE(nextAllowed(new Date(),true)));renderTables();await loadReservations();subscribe()});
</script>
