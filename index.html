<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>LEVEL Caffe & Night Bar - Rezervacije</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0a0a0c;
      --card: #141419;
      --border: #2a2a35;
      --cyan: #00e5ff;
      --teal: #0d9488;
      --free: #10b981;
      --reserved: #ef4444;
      --selected: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 12px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 6px;
      color: var(--cyan);
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .legend {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    .dot.free {
      background: var(--free);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .dot.reserved {
      background: var(--reserved);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    .dot.selected {
      background: var(--selected);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .map-wrapper {
      display: flex;
      width: 100%;
      height: calc(100dvh - 170px);
      min-height: 500px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      background:
        radial-gradient(circle at center, rgba(0, 229, 255, 0.08), transparent 60%),
        linear-gradient(180deg, #17171e 0%, #111115 100%);
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45),
        inset 0 0 40px rgba(0, 229, 255, 0.04);
    }

    #club-svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .club-label {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .zone-label {
      fill: #f3f4f6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .table-node {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .table-node:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
    }

    .table-node.is-reserved {
      cursor: not-allowed;
    }

    .status-free {
      fill: var(--free);
      stroke: #ffffff;
      stroke-width: 2;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
    }

    .status-reserved {
      fill: var(--reserved);
      stroke: #7f1d1d;
      stroke-width: 2;
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.35));
    }

    .status-selected {
      fill: var(--selected);
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5));
      animation: pulseSelected 1.5s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .dj-zone {
      fill: #1c1c24;
      stroke: #4b5563;
      stroke-width: 2;
    }

    .vip-zone {
      fill: #083b32;
      stroke: #14b8a6;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 15px rgba(20, 184, 166, 0.25));
    }

    .bar-zone {
      fill: #241810;
      stroke: #f59e0b;
      stroke-width: 2;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.2));
    }

    .wc-zone {
      fill: #181820;
      stroke: #374151;
      stroke-width: 2;
    }

    .entrance-zone {
      fill: var(--teal);
      filter: drop-shadow(0 0 12px rgba(13, 148, 136, 0.4));
    }

    .footer-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 16px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(4px);
    }

    .modal.is-open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal h2 {
      margin: 0 0 18px;
      color: var(--cyan);
      font-size: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      outline: none;
      background: #0f0f14;
      color: #ffffff;
      border: 1px solid #333344;
      border-radius: 10px;
      font-size: 16px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .btn-save {
      flex: 1;
      background: var(--free);
      color: #ffffff;
    }

    .btn-cancel {
      flex: 1;
      background: #292936;
      color: #ffffff;
    }

    .btn-whatsapp {
      width: 100%;
      margin-top: 10px;
      background: #25d366;
      color: #ffffff;
    }

    @keyframes pulseSelected {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (max-width: 768px) {
      body {
        padding: 8px;
      }

      .header h1 {
        font-size: 20px;
      }

      .legend {
        gap: 8px;
      }

      .legend-item {
        font-size: 12px;
      }

      .map-wrapper {
        height: calc(100dvh - 145px);
        min-height: 420px;
        border-radius: 14px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 18px;
        letter-spacing: 1px;
      }

      .legend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 8px 10px;
      }

      .legend-item {
        justify-content: center;
        font-size: 11px;
      }

      .legend-item:last-child {
        grid-column: 1 / -1;
      }

      .map-wrapper {
        height: calc(100dvh - 142px);
        min-height: 400px;
        padding: 4px;
      }

      .footer-note {
        font-size: 11px;
      }
    }

    @media (hover: none) {
      .table-node:hover {
        transform: none;
        filter: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

  <div id="reservationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h2 id="modalTitle">Rezervacija stola</h2>

      <div class="field">
        <label for="reservationName">Ime i prezime</label>
        <input type="text" id="reservationName" placeholder="npr. Marko Horvat" autocomplete="name" maxlength="80">

      <div class="field">

      <button id="whatsAppButton" class="btn btn-whatsapp" type="button">Pošalji na WhatsApp</button>
    </div>
  </div>

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedTable = null;
    let reservedTables = new Set();
    let isSaving = false;

    const tables = {
      1: { x: 380, y: 495, shape: "rect", w: 32, h: 24 },
      2: { x: 435, y: 520, shape: "rect", w: 22, h: 36 },
      3: { x: 380, y: 545, shape: "rect", w: 32, h: 22 },

      30: { x: 235, y: 190, shape: "circle", r: 13 },
      31: { x: 315, y: 170, shape: "circle", r: 13 },
      32: { x: 315, y: 110, shape: "circle", r: 13 },
      33: { x: 315, y: 65, shape: "circle", r: 13 },
      34: { x: 235, y: 65, shape: "circle", r: 13 },
      35: { x: 235, y: 125, shape: "circle", r: 13 },
      36: { x: 155, y: 110, shape: "circle", r: 13 },
      37: { x: 155, y: 65, shape: "circle", r: 13 }
    };

    const modal = document.getElementById("reservationModal");
    const modalTitle = document.getElementById("modalTitle");
    const nameInput = document.getElementById("reservationName");
    const phoneInput = document.getElementById("reservationPhone");
    const dateInput = document.getElementById("reservationDate");
    const timeInput = document.getElementById("reservationTime");
    const countInput = document.getElementById("reservationCount");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    const whatsAppButton = document.getElementById("whatsAppButton");

    function getLocalISODate() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().split("T")[0];
    }

    function renderTables() {
      const layer = document.getElementById("tables-layer");
      layer.innerHTML = "";

      Object.entries(tables).forEach(([idText, table]) => {
        const id = Number(idText);
        const isReserved = reservedTables.has(id);
        const isSelected = selectedTable === id;
        const statusClass = isReserved
          ? "status-reserved"
          : isSelected
            ? "status-selected"
            : "status-free";

        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", `table-node${isReserved ? " is-reserved" : ""}`);
        group.setAttribute("role", "button");
        group.setAttribute("tabindex", "0");
        group.setAttribute("aria-label", `Stol ${id}, ${isReserved ? "rezerviran" : "slobodan"}`);

        let centerX;
        let centerY;

        if (table.shape === "rect") {
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", table.x);
          rect.setAttribute("y", table.y);
          rect.setAttribute("width", table.w);
          rect.setAttribute("height", table.h);
          rect.setAttribute("rx", "4");
          rect.setAttribute("class", statusClass);
          group.appendChild(rect);
          centerX = table.x + table.w / 2;
          centerY = table.y + table.h / 2;
        } else {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", table.x);
          circle.setAttribute("cy", table.y);
          circle.setAttribute("r", table.r);
          circle.setAttribute("class", statusClass);
          group.appendChild(circle);
          centerX = table.x;
          centerY = table.y;
        }

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", centerX);
        label.setAttribute("y", centerY);
        label.setAttribute("class", "club-label");
        label.textContent = id;
        group.appendChild(label);

        const activate = () => selectTable(id);
        group.addEventListener("click", activate);
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            activate();
          }
        });

        layer.appendChild(group);
      });
    }

    function selectTable(id) {
      if (reservedTables.has(id)) {
        alert(`Stol ${id} je već rezerviran.`);
        return;
      }

      selectedTable = id;
      modalTitle.textContent = `Rezervacija stola #${id}`;
      modal.classList.add("is-open");
      document.body.style.overflow = "hidden";
      renderTables();
      setTimeout(() => nameInput.focus(), 0);
    }

    function closeModal() {
      modal.classList.remove("is-open");
      document.body.style.overflow = "";
      selectedTable = null;
      renderTables();
    }

    function resetForm() {
      nameInput.value = "";
      phoneInput.value = "";
      timeInput.value = "00:00";
      countInput.value = "4";
    }

    function validateForm() {
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const date = dateInput.value;
      const time = timeInput.value;
      const count = Number(countInput.value);
      const phoneRegex = /^[0-9+\s()-]{8,20}$/;

      if (!selectedTable) {
        throw new Error("Odaberite stol.");
      }

      if (!name || !phone || !date) {
        throw new Error("Popunite sva obavezna polja.");
      }

      if (!phoneRegex.test(phone)) {
        throw new Error("Unesite ispravan broj mobitela.");
      }

      if (date < getLocalISODate()) {
        throw new Error("Datum rezervacije ne može biti u prošlosti.");
      }

      if (!Number.isInteger(count) || count < 1 || count > 6) {
        throw new Error("Broj osoba mora biti između 1 i 6.");
      }

      return { name, phone, date, time, count };
    }

    async function saveReservation() {
      if (isSaving) {
        return;
      }

      isSaving = true;
      saveButton.disabled = true;
      saveButton.textContent = "Spremanje...";

      try {
        const reservation = validateForm();

        const { data: existing, error: checkError } = await supabaseClient
          .from("reservations")
          .select("id")
          .eq("table_id", selectedTable)
          .eq("reservation_date", reservation.date)
          .limit(1);

        if (checkError) {
          throw new Error("Nije moguće provjeriti raspoloživost stola.");
        }

        if (existing && existing.length > 0) {
          await loadReservations(reservation.date);
          throw new Error("Stol je u međuvremenu rezerviran. Odaberite drugi stol.");
        }

        const tableId = selectedTable;
        const { error: insertError } = await supabaseClient
          .from("reservations")
          .insert([{
            table_id: tableId,
            reservation_date: reservation.date,
            reservation_time: reservation.time,
            guest_count: reservation.count,
            name: reservation.name,
            phone: reservation.phone
          }]);

        if (insertError) {
          if (insertError.code === "23505") {
            await loadReservations(reservation.date);
            throw new Error("Stol je u međuvremenu rezerviran. Odaberite drugi stol.");
          }
          throw new Error("Greška kod spremanja rezervacije.");
        }

        reservedTables.add(tableId);
        alert(`Rezervacija je uspješno spremljena za stol #${tableId}.`);
        resetForm();
        closeModal();
        await loadReservations(reservation.date);
      } catch (error) {
        console.error(error);
        alert(error.message || "Došlo je do neočekivane greške.");
      } finally {
        isSaving = false;
        saveButton.disabled = false;
        saveButton.textContent = "Potvrdi rezervaciju";
      }
    }

    function sendWhatsApp() {
      try {
        const reservation = validateForm();
        const message = `Pozdrav LEVEL Caffe & Night Bar,\n\nZahtjev za rezervaciju:\n\nStol: #${selectedTable}\nDatum: ${reservation.date}\nVrijeme: ${reservation.time}\nBroj osoba: ${reservation.count}\n\nIme i prezime: ${reservation.name}\nMobitel: ${reservation.phone}`;
        const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank", "noopener,noreferrer");
      } catch (error) {
        alert(error.message || "Popunite podatke za WhatsApp poruku.");
      }
    }

    async function loadReservations(date = dateInput.value || getLocalISODate()) {
      const { data, error } = await supabaseClient
        .from("reservations")
        .select("table_id")
        .eq("reservation_date", date);

      if (error) {
        console.error(error);
        alert("Nije moguće učitati rezervacije. Pokušajte ponovno.");
        renderTables();
        return;
      }

      reservedTables = new Set((data || []).map((row) => Number(row.table_id)));

      if (selectedTable !== null && reservedTables.has(selectedTable)) {
        closeModal();
      } else {
        renderTables();
      }
    }

    function subscribeToReservations() {
      supabaseClient
        .channel("reservations-live")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "reservations" },
          () => loadReservations()
        )
        .subscribe((status) => {
          if (status === "CHANNEL_ERROR") {
            console.error("Realtime kanal nije dostupan.");
          }
        });
    }

    saveButton.addEventListener("click", saveReservation);
    cancelButton.addEventListener("click", closeModal);
    whatsAppButton.addEventListener("click", sendWhatsApp);

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeModal();
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const today = getLocalISODate();
      dateInput.min = today;
      dateInput.value = today;
      dateInput.addEventListener("change", () => loadReservations(dateInput.value));
      renderTables();
      await loadReservations(today);
      subscribeToReservations();
    });
  </script>
</body>
</html>
